<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo Aktiveerimine - Pilvetark</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f6f9fc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container { max-width: 450px; width: 100%; }

        .mock-badge {
            background: #fef3c7;
            border: 1px solid #f59e0b;
            color: #92400e;
            padding: 8px 16px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 16px;
            font-size: 13px;
        }

        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .card-header {
            background: #635bff;
            color: white;
            padding: 20px 24px;
            text-align: center;
        }
        .card-header h1 { font-size: 1.25rem; margin-bottom: 4px; }
        .card-header p { opacity: 0.8; font-size: 0.85rem; }

        .card-body { padding: 24px; }

        .payment-info {
            background: #f8fafc;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 20px;
        }
        .payment-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #e2e8f0;
        }
        .payment-row:last-child { border-bottom: none; }
        .payment-label { color: #64748b; font-size: 14px; }
        .payment-value { font-weight: 600; color: #1e293b; }
        .payment-total { font-size: 1.25rem; color: #635bff; }

        .form-group { margin-bottom: 16px; }
        .form-group label {
            display: block;
            font-size: 13px;
            color: #64748b;
            margin-bottom: 6px;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            font-size: 15px;
        }
        .form-group input:focus {
            outline: none;
            border-color: #635bff;
            box-shadow: 0 0 0 3px rgba(99, 91, 255, 0.1);
        }

        .card-row {
            display: flex;
            gap: 12px;
        }
        .card-row .form-group { flex: 1; }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 10px;
        }
        .btn-primary {
            background: #635bff;
            color: white;
        }
        .btn-primary:hover { background: #5248e5; }
        .btn-secondary {
            background: #f1f5f9;
            color: #64748b;
        }
        .btn-secondary:hover { background: #e2e8f0; }

        .test-cards {
            margin-top: 20px;
            padding: 16px;
            background: #f0fdf4;
            border-radius: 8px;
            border: 1px solid #86efac;
        }
        .test-cards h3 {
            font-size: 13px;
            color: #166534;
            margin-bottom: 8px;
        }
        .test-cards p {
            font-size: 12px;
            color: #15803d;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="mock-badge">
            DEMO REŽIIM – See on simuleeritud aktiveerimisleht
        </div>

        <div class="card">
            <div class="card-header">
                <h1>Pilvetark</h1>
                <p>Turvaline aktiveerimine</p>
            </div>

            <div class="card-body">
                <div class="payment-info">
                    <div class="payment-row">
                        <span class="payment-label">Kontakt</span>
                        <span class="payment-value" id="emailDisplay">-</span>
                    </div>
                    <div class="payment-row">
                        <span class="payment-label">Aktiveerimistasu</span>
                        <span class="payment-value payment-total" id="amountDisplay">-</span>
                    </div>
                </div>

                <div class="form-group">
                    <label>Kaardi number</label>
                    <input type="text" value="4242 4242 4242 4242" readonly>
                </div>

                <div class="card-row">
                    <div class="form-group">
                        <label>Kehtiv kuni</label>
                        <input type="text" value="12/28" readonly>
                    </div>
                    <div class="form-group">
                        <label>CVC</label>
                        <input type="text" value="123" readonly>
                    </div>
                </div>

                <button class="btn btn-primary" onclick="completePayment()">
                    Aktiveeri
                </button>
                <button class="btn btn-secondary" onclick="cancelPayment()">
                    Tühista
                </button>

                <div class="test-cards">
                    <h3>Demo režiim</h3>
                    <p>Kaardi andmed on eeltäidetud. Vajutage "Aktiveeri" simuleerimiseks.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const sessionId = params.get('session_id');
        const amount = params.get('amount');
        const email = params.get('email');

        document.getElementById('emailDisplay').textContent = email || '-';
        document.getElementById('amountDisplay').textContent = amount ? amount + ' EUR' : '-';

        function getApiKey() {
            const saved = localStorage.getItem('mcp_gateway_api_key');
            if (saved) return saved;
            const host = window.location.hostname;
            if (host === 'localhost' || host === '127.0.0.1') return 'dev-key';
            return '';
        }

        async function completePayment() {
            try {
                const res = await fetch('/api/payments/mock/complete', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-API-Key': getApiKey()
                    },
                    body: JSON.stringify({ sessionId })
                });

                if (res.ok) {
                    window.location.href = '/payment/success?session_id=' + sessionId;
                } else {
                    alert('Aktiveerimine ebaõnnestus');
                }
            } catch (e) {
                alert('Viga: ' + e.message);
            }
        }

        async function cancelPayment() {
            try {
                await fetch('/api/payments/mock/cancel', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-API-Key': getApiKey()
                    },
                    body: JSON.stringify({ sessionId })
                });
            } catch (e) {}

            window.location.href = '/payment/cancel?session_id=' + sessionId;
        }
    </script>
</body>
</html>
