<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pilvetark - Maksed</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container { max-width: 420px; width: 100%; }

        .card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 15px 50px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        .card-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 24px;
            text-align: center;
        }
        .card-header h1 { font-size: 1.5rem; margin-bottom: 4px; }
        .card-header p { opacity: 0.9; font-size: 0.9rem; }

        .card-body { padding: 24px; }

        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #374151;
            margin-bottom: 6px;
        }
        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.2s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }
        .form-group input::placeholder { color: #9ca3af; }

        .amount-input-wrapper {
            position: relative;
        }
        .amount-input-wrapper input {
            padding-right: 50px;
        }
        .currency-label {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #6b7280;
            font-weight: 500;
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .submit-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }
        .submit-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .error-msg {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #dc2626;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 16px;
            display: none;
        }
        .error-msg.visible { display: block; }

        .status-card {
            text-align: center;
            padding: 32px 24px;
        }
        .status-icon {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            font-size: 28px;
        }
        .status-icon.pending { background: #fef3c7; }
        .status-icon.success { background: #d1fae5; }
        .status-icon.error { background: #fee2e2; }

        .status-title { font-size: 1.25rem; font-weight: 600; color: #1f2937; margin-bottom: 8px; }
        .status-desc { color: #6b7280; font-size: 14px; margin-bottom: 20px; }

        .loading-spinner {
            width: 24px;
            height: 24px;
            border: 3px solid #e5e7eb;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .back-btn {
            background: #f3f4f6;
            color: #374151;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            margin-top: 12px;
        }
        .back-btn:hover { background: #e5e7eb; }

        .footer {
            text-align: center;
            padding: 16px;
            background: #f9fafb;
            border-top: 1px solid #e5e7eb;
            font-size: 12px;
            color: #9ca3af;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="card-header">
                <h1>Pilvetark</h1>
                <p>Turvaline maksmine</p>
            </div>

            <!-- Payment Form -->
            <div id="paymentForm" class="card-body">
                <div id="errorMsg" class="error-msg"></div>

                <form onsubmit="submitPayment(event)">
                    <div class="form-group">
                        <label for="email">E-posti aadress</label>
                        <input type="email" id="email" placeholder="nimi@ettevote.ee" required>
                    </div>

                    <div class="form-group">
                        <label for="amount">Summa</label>
                        <div class="amount-input-wrapper">
                            <input type="number" id="amount" placeholder="0.00" min="0.50" step="0.01" required>
                            <span class="currency-label">EUR</span>
                        </div>
                    </div>

                    <button type="submit" class="submit-btn" id="submitBtn">
                        Maksa
                    </button>
                </form>
            </div>

            <!-- Processing Status -->
            <div id="processingView" class="status-card hidden">
                <div class="status-icon pending">
                    <div class="loading-spinner"></div>
                </div>
                <div class="status-title">Ootan makset...</div>
                <div class="status-desc">Suuname teid makseteenusesse. Palun arge sulgege seda akent.</div>
            </div>

            <!-- Success Status -->
            <div id="successView" class="status-card hidden">
                <div class="status-icon success">&#10003;</div>
                <div class="status-title">Makse onnestus!</div>
                <div class="status-desc" id="successDesc">Teie makse on edukalt tehtud.</div>
                <button class="back-btn" onclick="resetForm()">Uus makse</button>
            </div>

            <!-- Error Status -->
            <div id="errorView" class="status-card hidden">
                <div class="status-icon error">!</div>
                <div class="status-title">Makse ebaonnestus</div>
                <div class="status-desc" id="errorDesc">Midagi laks valesti. Palun proovige uuesti.</div>
                <button class="back-btn" onclick="resetForm()">Proovi uuesti</button>
            </div>

            <div class="footer">
                Pilvetark OU &middot; Turvaline maksmine Stripe kaudu
            </div>
        </div>
    </div>

    <script>
        const API_KEY_STORAGE_KEY = 'mcp_gateway_api_key';
        let currentPaymentId = null;
        let pollInterval = null;

        function getApiKey() {
            const saved = localStorage.getItem(API_KEY_STORAGE_KEY);
            if (saved) return saved;
            const host = window.location.hostname;
            if (host === 'localhost' || host === '127.0.0.1' || host.startsWith('192.168.')) {
                return 'dev-key';
            }
            return '';
        }

        function showError(msg) {
            const el = document.getElementById('errorMsg');
            el.textContent = msg;
            el.classList.add('visible');
        }

        function hideError() {
            document.getElementById('errorMsg').classList.remove('visible');
        }

        function showView(viewId) {
            ['paymentForm', 'processingView', 'successView', 'errorView'].forEach(id => {
                document.getElementById(id).classList.toggle('hidden', id !== viewId);
            });
        }

        async function submitPayment(e) {
            e.preventDefault();
            hideError();

            const email = document.getElementById('email').value.trim();
            const amount = parseFloat(document.getElementById('amount').value);

            if (!email || !amount || amount < 0.50) {
                showError('Palun sisestage e-posti aadress ja summa (min 0.50 EUR)');
                return;
            }

            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.textContent = 'Laen...';

            try {
                const res = await fetch('/api/payments/checkout', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-API-Key': getApiKey()
                    },
                    body: JSON.stringify({ email, amount, currency: 'EUR' })
                });

                const data = await res.json();

                if (!data.ok) {
                    showError(data.error || 'Makse loomine ebaonnestus');
                    btn.disabled = false;
                    btn.textContent = 'Maksa';
                    return;
                }

                currentPaymentId = data.paymentId;
                showView('processingView');

                // Open Stripe Checkout in same window
                window.location.href = data.checkoutUrl;

            } catch (err) {
                showError('Uhenduse viga. Palun kontrollige internetiuhendust.');
                btn.disabled = false;
                btn.textContent = 'Maksa';
            }
        }

        async function checkPaymentStatus() {
            if (!currentPaymentId) return;

            try {
                const res = await fetch(`/api/payments/${currentPaymentId}/refresh`, {
                    method: 'POST',
                    headers: { 'X-API-Key': getApiKey() }
                });
                const data = await res.json();

                if (data.ok && data.payment) {
                    const status = data.payment.status;
                    if (status === 'COMPLETED') {
                        clearInterval(pollInterval);
                        document.getElementById('successDesc').textContent =
                            `Makse summas ${data.payment.amount} EUR on edukalt tehtud.`;
                        showView('successView');
                    } else if (status === 'FAILED' || status === 'CANCELLED') {
                        clearInterval(pollInterval);
                        showView('errorView');
                    }
                }
            } catch (err) {
                console.error('Status check failed', err);
            }
        }

        function resetForm() {
            currentPaymentId = null;
            if (pollInterval) clearInterval(pollInterval);
            document.getElementById('email').value = '';
            document.getElementById('amount').value = '';
            document.getElementById('submitBtn').disabled = false;
            document.getElementById('submitBtn').textContent = 'Maksa';
            hideError();
            showView('paymentForm');
        }

        // Check if returning from Stripe
        (function init() {
            const params = new URLSearchParams(window.location.search);
            const sessionId = params.get('session_id');

            if (sessionId) {
                showView('processingView');

                // Get payment by session and start polling
                fetch(`/api/payments/session/${sessionId}`, {
                    headers: { 'X-API-Key': getApiKey() }
                })
                .then(res => res.json())
                .then(data => {
                    if (data.ok && data.payment) {
                        currentPaymentId = data.payment.id;
                        const status = data.payment.status;

                        if (status === 'COMPLETED') {
                            document.getElementById('successDesc').textContent =
                                `Makse summas ${data.payment.amount} EUR on edukalt tehtud.`;
                            showView('successView');
                        } else if (status === 'FAILED' || status === 'CANCELLED') {
                            showView('errorView');
                        } else {
                            // Start polling
                            pollInterval = setInterval(checkPaymentStatus, 2000);
                        }
                    } else {
                        showView('errorView');
                    }
                })
                .catch(() => showView('errorView'));

                // Clean URL
                window.history.replaceState({}, document.title, '/');
            }
        })();
    </script>
</body>
</html>
