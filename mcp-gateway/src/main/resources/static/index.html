<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pilvetark - AI Assistent</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 800px; margin: 0 auto; }

        /* Header - simplified */
        .header { text-align: center; color: white; margin-bottom: 24px; }
        .header h1 { font-size: 1.8rem; margin-bottom: 6px; text-shadow: 0 2px 10px rgba(0,0,0,0.2); }
        .header p { font-size: 0.95rem; opacity: 0.9; }

        /* Main Chat Card */
        .chat-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 15px 50px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        .chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .chat-header h2 { font-size: 1.1rem; display: flex; align-items: center; gap: 10px; }
        .chat-header-dot { width: 10px; height: 10px; background: #10b981; border-radius: 50%; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .advanced-toggle {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .advanced-toggle:hover { background: rgba(255,255,255,0.3); }
        .advanced-toggle.active { background: rgba(255,255,255,0.4); }

        /* Chat Messages */
        .chat-messages {
            height: 400px;
            overflow-y: auto;
            padding: 20px;
            background: #f8fafc;
        }
        .chat-message { margin-bottom: 16px; display: flex; flex-direction: column; }
        .chat-message.user { align-items: flex-end; }
        .chat-message.assistant { align-items: flex-start; }
        .chat-bubble {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.5;
        }
        .chat-message.user .chat-bubble {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border-bottom-right-radius: 4px;
        }
        .chat-message.assistant .chat-bubble {
            background: white;
            color: #1e293b;
            border: 1px solid #e2e8f0;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .chat-bubble.thinking { color: #64748b; font-style: italic; }
        .thinking-dots { display: inline-flex; gap: 4px; margin-left: 8px; }
        .thinking-dots span { width: 6px; height: 6px; background: #667eea; border-radius: 50%; animation: bounce 1.4s infinite ease-in-out; }
        .thinking-dots span:nth-child(1) { animation-delay: 0s; }
        .thinking-dots span:nth-child(2) { animation-delay: 0.2s; }
        .thinking-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0.8); } 40% { transform: scale(1.2); } }

        /* Result formatting */
        .result-summary { margin-bottom: 8px; }
        .result-list { margin: 8px 0; padding-left: 0; list-style: none; }
        .result-item { padding: 8px 12px; background: #f1f5f9; border-radius: 8px; margin-bottom: 6px; font-size: 13px; display: flex; justify-content: space-between; align-items: center; }
        .result-item-name { font-weight: 500; color: #1e293b; }
        .result-item-detail { color: #64748b; font-size: 12px; }
        .result-item-value { font-weight: 600; color: #667eea; }
        .result-item-status { font-size: 11px; padding: 2px 8px; border-radius: 10px; }
        .result-item-status.paid { background: #d1fae5; color: #065f46; }
        .result-item-status.unpaid { background: #fef3c7; color: #92400e; }
        .result-item-status.overdue { background: #fee2e2; color: #991b1b; }
        .msg-success { color: #065f46; }
        .msg-error { color: #991b1b; }
        .download-btn {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin-left: 12px;
            padding: 4px 10px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .download-btn:hover { background: #5a6fd6; }

        .json-details { margin-top: 10px; }
        .json-details summary { font-size: 12px; color: #94a3b8; cursor: pointer; }
        .json-details summary:hover { color: #667eea; }
        .json-details pre { margin-top: 8px; padding: 12px; background: #f1f5f9; border-radius: 8px; font-size: 10px; overflow-x: auto; max-height: 150px; }

        /* Quick Suggestions */
        .quick-suggestions {
            padding: 12px 20px;
            background: #f8fafc;
            border-top: 1px solid #e2e8f0;
        }
        .quick-suggestions-label {
            font-size: 11px;
            color: #94a3b8;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .quick-suggestions-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .quick-btn {
            padding: 8px 14px;
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            font-size: 13px;
            color: #475569;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .quick-btn:hover { border-color: #667eea; color: #667eea; background: #f0f0ff; }
        .quick-btn .emoji { font-size: 14px; }

        /* Chat Input */
        .chat-input-area { padding: 16px 20px; background: white; border-top: 1px solid #e2e8f0; }
        .chat-input-row { display: flex; gap: 10px; }
        .chat-input {
            flex: 1;
            padding: 14px 18px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 15px;
            transition: border-color 0.2s;
        }
        .chat-input:focus { outline: none; border-color: #667eea; }
        .chat-input::placeholder { color: #94a3b8; }
        .send-btn {
            padding: 14px 24px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .send-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4); }

        /* Advanced Panel (hidden by default) */
        .advanced-panel {
            display: none;
            padding: 16px 20px;
            background: #f1f5f9;
            border-top: 1px solid #e2e8f0;
        }
        .advanced-panel.visible { display: block; }
        .advanced-panel h4 { font-size: 12px; color: #64748b; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
        .tool-buttons { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
        .tool-btn {
            padding: 6px 12px;
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            font-size: 12px;
            color: #475569;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tool-btn:hover { border-color: #667eea; }
        .tool-btn.selected { background: #667eea; color: white; border-color: #667eea; }
        .tool-btn .emoji { margin-right: 4px; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 12px; color: #64748b; margin-bottom: 4px; }
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            font-family: monospace;
            font-size: 12px;
            resize: vertical;
            min-height: 60px;
        }

        /* Footer info */
        .footer-info {
            text-align: center;
            margin-top: 20px;
            color: rgba(255,255,255,0.7);
            font-size: 12px;
        }
        .footer-info a { color: rgba(255,255,255,0.9); }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏢 Pilvetark OÜ</h1>
            <p>AI-assistent teie ettevõtte andmetele</p>
        </div>

        <div class="chat-card">
            <div class="chat-header">
                <h2><span class="chat-header-dot"></span> Assistent</h2>
                <button class="advanced-toggle" onclick="toggleAdvanced()">⚙️ Täpsem</button>
            </div>

            <div class="chat-messages" id="chatMessages"></div>

            <div class="advanced-panel" id="advancedPanel">
                <h4>Vali tööriist</h4>
                <div class="tool-buttons" id="toolButtons"></div>
                <div class="form-group">
                    <label>Parameetrid (JSON)</label>
                    <textarea id="argsInput" placeholder='{"key": "value"}'></textarea>
                </div>
            </div>

            <div class="quick-suggestions">
                <div class="quick-suggestions-label">Kiirvalikud</div>
                <div class="quick-suggestions-buttons">
                    <button class="quick-btn" onclick="quickAction('invoices')"><span class="emoji">🧾</span> Arveid</button>
                    <button class="quick-btn" onclick="quickAction('employees')"><span class="emoji">👥</span> Töötajaid</button>
                    <button class="quick-btn" onclick="quickAction('products')"><span class="emoji">📦</span> Laoseisu</button>
                    <button class="quick-btn" onclick="quickAction('balance')"><span class="emoji">💰</span> Kontojääki</button>
                    <button class="quick-btn" onclick="quickAction('payroll')"><span class="emoji">💵</span> Palgalehte</button>
                </div>
            </div>

            <div class="chat-input-area">
                <div class="chat-input-row">
                    <input type="text" class="chat-input" id="chatInput" placeholder="Kirjutage oma kusimus vabas vormis, nt 'Millised arved on maksmata?'" onkeydown="if(event.key==='Enter')sendMessage()">
                    <button class="send-btn" onclick="sendMessage()">Saada</button>
                </div>
            </div>
        </div>

        <div class="footer-info">
            Pilvetark OÜ · Reg: 14892367 · <a href="#" onclick="toggleAdvanced()">Tehniline vaade</a>
        </div>
    </div>

    <script>
        let selectedTool = null;
        let isThinking = false;
        let advancedMode = false;
        const messages = [];
        const apiKey = 'dev-key';
        let lastExportData = null;
        let lastExportName = '';

        const quickActions = {
            invoices: { tool: 'accounting.getInvoices', args: {}, label: 'Näita arveid' },
            employees: { tool: 'hr.getEmployees', args: {}, label: 'Näita töötajaid' },
            products: { tool: 'inventory.getProducts', args: {}, label: 'Näita laoseisu' },
            balance: { tool: 'accounting.getBalance', args: {}, label: 'Näita kontojääki' },
            payroll: { tool: 'hr.getPayroll', args: {}, label: 'Näita palgalehte' }
        };

        const toolLabels = {
            'accounting.getInvoices': 'arvete päring',
            'accounting.getBalance': 'kontojääkide päring',
            'accounting.getReport': 'finantsaruanne',
            'inventory.getProducts': 'laoseisu päring',
            'inventory.getOrders': 'tellimuste päring',
            'hr.getEmployees': 'töötajate päring',
            'hr.getPayroll': 'palgaleht',
            'fs.listDir': 'kausta sisu',
            'fs.readFile': 'faili lugemine',
            'web.fetch': 'veebipäring'
        };

        const toolEmojis = {
            'accounting.getInvoices': '🧾', 'accounting.getBalance': '💰', 'accounting.getReport': '📊',
            'inventory.getProducts': '📦', 'inventory.getOrders': '🛒',
            'hr.getEmployees': '👥', 'hr.getPayroll': '💵',
            'fs.listDir': '📁', 'fs.readFile': '📄', 'web.fetch': '🌐'
        };

        const allTools = [
            'accounting.getInvoices', 'accounting.getBalance', 'accounting.getReport',
            'inventory.getProducts', 'inventory.getOrders', 'hr.getEmployees', 'hr.getPayroll',
            'fs.listDir', 'fs.readFile', 'web.fetch'
        ];

        function escapeHtml(t) { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }

        function downloadExcel() {
            if (!lastExportData || !Array.isArray(lastExportData)) return;
            const data = lastExportData;
            if (data.length === 0) return;

            // Get headers from first item
            const headers = Object.keys(data[0]);
            const rows = [headers.join(';')];

            data.forEach(item => {
                const row = headers.map(h => {
                    let val = item[h];
                    if (val === null || val === undefined) val = '';
                    val = String(val).replace(/"/g, '""');
                    if (val.includes(';') || val.includes('"') || val.includes('\n')) val = `"${val}"`;
                    return val;
                });
                rows.push(row.join(';'));
            });

            const csv = '\uFEFF' + rows.join('\n'); // BOM for Excel UTF-8
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = (lastExportName || 'andmed') + '.csv';
            a.click();
            URL.revokeObjectURL(url);
        }

        function appendMessage(type, content, jsonData = null) {
            messages.push({ type, content, jsonData, ts: Date.now() });
            renderMessages();
        }

        function setThinking(show) {
            isThinking = show;
            renderMessages();
        }

        function renderMessages() {
            const container = document.getElementById('chatMessages');
            let html = messages.map(m => {
                if (m.type === 'user') {
                    return `<div class="chat-message user"><div class="chat-bubble">${escapeHtml(m.content)}</div></div>`;
                } else {
                    const jsonSection = m.jsonData ? `<details class="json-details"><summary>Näita tehnilist infot</summary><pre>${escapeHtml(JSON.stringify(m.jsonData, null, 2))}</pre></details>` : '';
                    return `<div class="chat-message assistant"><div class="chat-bubble"><div>${m.content}</div>${jsonSection}</div></div>`;
                }
            }).join('');

            if (isThinking) {
                html += `<div class="chat-message assistant"><div class="chat-bubble thinking">Otsin andmeid<span class="thinking-dots"><span></span><span></span><span></span></span></div></div>`;
            }

            container.innerHTML = html || `<div class="chat-message assistant"><div class="chat-bubble">Tere! 👋 Olen teie ettevõtte assistent. Küsige arvete, töötajate, laoseisu või muu kohta.</div></div>`;
            container.scrollTop = container.scrollHeight;
        }

        function formatResult(tool, data) {
            if (!data.ok) {
                lastExportData = null;
                return `<span class="msg-error">Vabandust, midagi läks valesti. Palun proovige uuesti.</span>`;
            }

            let result = data.result;
            let html = '';
            const downloadBtn = '<button class="download-btn" onclick="downloadExcel()">📥 Laadi Excel</button>';

            // Extract array from object if needed (API returns {invoices: [...]} or {employees: [...]} etc)
            if (result && typeof result === 'object' && !Array.isArray(result)) {
                const arrayKey = Object.keys(result).find(k => Array.isArray(result[k]));
                if (arrayKey) {
                    result = result[arrayKey];
                }
            }

            if (tool === 'accounting.getInvoices' && Array.isArray(result)) {
                lastExportData = result;
                lastExportName = 'arved';
                const total = result.reduce((sum, inv) => sum + (inv.amount || inv.total || 0), 0);
                html = `<div class="result-summary"><strong>Leitud ${result.length} arvet</strong> · Kokku: ${total.toLocaleString('et-EE')}€ ${downloadBtn}</div><div class="result-list">`;
                result.forEach(inv => {
                    const status = inv.status || 'unpaid';
                    const statusLabel = status === 'paid' ? 'Makstud' : status === 'overdue' ? 'Üle tähtaja' : 'Maksmata';
                    html += `<div class="result-item"><div><div class="result-item-name">${escapeHtml(inv.client || inv.customer || 'Klient')}</div><div class="result-item-detail">${escapeHtml(inv.number || inv.id || '')}</div></div><div style="text-align:right"><div class="result-item-value">${(inv.amount || inv.total || 0).toLocaleString('et-EE')}€</div><span class="result-item-status ${status}">${statusLabel}</span></div></div>`;
                });
                html += '</div>';
            } else if (tool === 'hr.getEmployees' && Array.isArray(result)) {
                lastExportData = result;
                lastExportName = 'tootajad';
                html = `<div class="result-summary"><strong>Leitud ${result.length} töötajat</strong> ${downloadBtn}</div><div class="result-list">`;
                result.forEach(emp => {
                    html += `<div class="result-item"><div><div class="result-item-name">${escapeHtml(emp.name || 'Töötaja')}</div><div class="result-item-detail">${escapeHtml(emp.position || emp.role || emp.department || '')}</div></div><div class="result-item-detail">${escapeHtml(emp.email || '')}</div></div>`;
                });
                html += '</div>';
            } else if (tool === 'inventory.getProducts' && Array.isArray(result)) {
                lastExportData = result;
                lastExportName = 'laoseis';
                html = `<div class="result-summary"><strong>Leitud ${result.length} toodet</strong> ${downloadBtn}</div><div class="result-list">`;
                result.forEach(prod => {
                    const lowStock = (prod.stock || prod.quantity || 0) < 10;
                    html += `<div class="result-item"><div><div class="result-item-name">${escapeHtml(prod.name || 'Toode')}</div><div class="result-item-detail">${escapeHtml(prod.sku || prod.code || '')}</div></div><div style="text-align:right"><div class="result-item-value">${prod.stock || prod.quantity || 0} tk</div>${lowStock ? '<span class="result-item-status overdue">Vähe!</span>' : ''}</div></div>`;
                });
                html += '</div>';
            } else if (tool === 'accounting.getBalance') {
                if (Array.isArray(result)) {
                    lastExportData = result;
                    lastExportName = 'kontod';
                    html = `<div class="result-summary"><strong>Kontojäägid</strong> ${downloadBtn}</div><div class="result-list">`;
                    result.forEach(acc => {
                        html += `<div class="result-item"><div class="result-item-name">${escapeHtml(acc.name || acc.account || 'Konto')}</div><div class="result-item-value">${(acc.balance || acc.amount || 0).toLocaleString('et-EE')}€</div></div>`;
                    });
                    html += '</div>';
                } else if (result && typeof result === 'object') {
                    lastExportData = [result];
                    lastExportName = 'kontod';
                    html = `<div class="result-summary"><strong>Kontojääk:</strong> ${(result.balance || result.total || 0).toLocaleString('et-EE')}€ ${downloadBtn}</div>`;
                }
            } else if (tool === 'hr.getPayroll' && Array.isArray(result)) {
                lastExportData = result;
                lastExportName = 'palgaleht';
                const total = result.reduce((sum, p) => sum + (p.gross || p.amount || 0), 0);
                html = `<div class="result-summary"><strong>Palgaleht</strong> · Kokku: ${total.toLocaleString('et-EE')}€ ${downloadBtn}</div><div class="result-list">`;
                result.forEach(p => {
                    html += `<div class="result-item"><div class="result-item-name">${escapeHtml(p.name || p.employee || 'Töötaja')}</div><div class="result-item-value">${(p.gross || p.net || p.amount || 0).toLocaleString('et-EE')}€</div></div>`;
                });
                html += '</div>';
            } else if (tool === 'inventory.getOrders' && Array.isArray(result)) {
                lastExportData = result;
                lastExportName = 'tellimused';
                html = `<div class="result-summary"><strong>Leitud ${result.length} tellimust</strong> ${downloadBtn}</div><div class="result-list">`;
                result.forEach(ord => {
                    html += `<div class="result-item"><div><div class="result-item-name">${escapeHtml(ord.customer || ord.client || 'Tellimus')}</div><div class="result-item-detail">${escapeHtml(ord.id || ord.number || '')}</div></div><div class="result-item-value">${(ord.total || ord.amount || 0).toLocaleString('et-EE')}€</div></div>`;
                });
                html += '</div>';
            } else if (Array.isArray(result) && result.length > 0) {
                // Generic array - show as list
                lastExportData = result;
                lastExportName = 'andmed';
                const label = toolLabels[tool] || tool;
                html = `<div class="result-summary"><strong>${label.charAt(0).toUpperCase() + label.slice(1)}</strong> · ${result.length} kirjet ${downloadBtn}</div><div class="result-list">`;
                result.forEach(item => {
                    if (typeof item === 'object' && item !== null) {
                        const name = item.name || item.title || item.id || Object.values(item)[0] || '';
                        const detail = item.description || item.type || item.status || Object.values(item)[1] || '';
                        html += `<div class="result-item"><div class="result-item-name">${escapeHtml(String(name))}</div><div class="result-item-detail">${escapeHtml(String(detail))}</div></div>`;
                    } else {
                        html += `<div class="result-item">${escapeHtml(String(item))}</div>`;
                    }
                });
                html += '</div>';
            } else if (data.result && typeof data.result === 'object' && !Array.isArray(data.result)) {
                // Object with properties - display as list
                const obj = data.result;
                const entries = [];
                const flattenObj = (o, prefix = '') => {
                    Object.entries(o).forEach(([k, v]) => {
                        if (v && typeof v === 'object' && !Array.isArray(v)) {
                            flattenObj(v, prefix + k + '.');
                        } else {
                            entries.push({ key: prefix + k, value: v });
                        }
                    });
                };
                flattenObj(obj);
                lastExportData = entries.map(e => ({ [e.key]: e.value }));
                lastExportName = 'andmed';
                const label = toolLabels[tool] || tool;
                html = `<div class="result-summary"><strong>${label.charAt(0).toUpperCase() + label.slice(1)}</strong> ${downloadBtn}</div><div class="result-list">`;
                const labelMap = { name: 'Nimi', email: 'E-post', phone: 'Telefon', founded: 'Asutatud', vatNumber: 'KMKR', address: 'Aadress', balance: 'Saldo', total: 'Kokku' };
                entries.forEach(e => {
                    const keyLabel = labelMap[e.key.split('.').pop()] || e.key;
                    let val = e.value;
                    if (Array.isArray(val)) val = val.length + ' kirjet';
                    html += `<div class="result-item"><div class="result-item-name">${escapeHtml(keyLabel)}</div><div class="result-item-detail">${escapeHtml(String(val || '-'))}</div></div>`;
                });
                html += '</div>';
            } else {
                lastExportData = null;
                const label = toolLabels[tool] || tool;
                html = `<span class="msg-success">✓ ${label.charAt(0).toUpperCase() + label.slice(1)} õnnestus.</span>`;
            }

            return html;
        }

        function toggleAdvanced() {
            advancedMode = !advancedMode;
            document.getElementById('advancedPanel').classList.toggle('visible', advancedMode);
            document.querySelector('.advanced-toggle').classList.toggle('active', advancedMode);
        }

        function quickAction(action) {
            const qa = quickActions[action];
            if (qa) {
                selectedTool = qa.tool;
                appendMessage('user', qa.label);
                executeTool(qa.tool, qa.args);
            }
        }

        function selectTool(tool) {
            selectedTool = tool;
            document.querySelectorAll('.tool-btn').forEach(b => b.classList.toggle('selected', b.dataset.tool === tool));
            document.getElementById('argsInput').value = '{}';
        }

        async function sendMessage() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text) return;

            input.value = '';

            // Check if advanced mode with tool selected
            if (advancedMode && selectedTool) {
                appendMessage('user', text || `Käivitan: ${toolLabels[selectedTool] || selectedTool}`);
                let args = {};
                try { args = JSON.parse(document.getElementById('argsInput').value || '{}'); } catch(e) {}
                executeTool(selectedTool, args);
                return;
            }

            // Natural language - try to match intent
            appendMessage('user', text);
            const lower = text.toLowerCase();

            if (lower.includes('arve') || lower.includes('invoice')) {
                const status = lower.includes('maksm') ? (lower.includes('makstud') ? 'paid' : 'unpaid') : (lower.includes('tähtaj') ? 'overdue' : null);
                executeTool('accounting.getInvoices', status ? { status } : {});
            } else if (lower.includes('töötaj') || lower.includes('employee')) {
                executeTool('hr.getEmployees', {});
            } else if (lower.includes('lao') || lower.includes('tood') || lower.includes('product') || lower.includes('inventory')) {
                executeTool('inventory.getProducts', lower.includes('vähe') ? { lowStock: true } : {});
            } else if (lower.includes('konto') || lower.includes('jääk') || lower.includes('balance')) {
                executeTool('accounting.getBalance', {});
            } else if (lower.includes('palga') || lower.includes('payroll')) {
                executeTool('hr.getPayroll', {});
            } else if (lower.includes('aruanne') || lower.includes('report')) {
                executeTool('accounting.getReport', { type: 'profit_loss' });
            } else {
                setThinking(true);
                setTimeout(() => {
                    setThinking(false);
                    appendMessage('assistant', 'Ma saan aidata järgmistes valdkondades: <strong>arved</strong>, <strong>töötajad</strong>, <strong>laoseis</strong>, <strong>kontojäägid</strong> ja <strong>palgaleht</strong>. Proovige küsida näiteks "Näita maksmata arveid" või "Kes on töötajad?"');
                }, 500);
            }
        }

        async function executeTool(tool, args) {
            setThinking(true);
            try {
                const res = await fetch('/api/call', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-API-Key': apiKey },
                    body: JSON.stringify({ tool, arguments: args })
                });
                const data = await res.json();
                setThinking(false);
                appendMessage('assistant', formatResult(tool, data), data);
            } catch (e) {
                setThinking(false);
                appendMessage('assistant', `<span class="msg-error">Ühenduse viga. Palun proovige uuesti.</span>`);
            }
        }

        function renderToolButtons() {
            document.getElementById('toolButtons').innerHTML = allTools.map(t =>
                `<button class="tool-btn" data-tool="${t}" onclick="selectTool('${t}')"><span class="emoji">${toolEmojis[t] || '🔧'}</span>${t.split('.')[1]}</button>`
            ).join('');
        }

        (function init() {
            renderMessages();
            renderToolButtons();
        })();
    </script>
</body>
</html>
