<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCP Gateway Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
        }
        .header {
            background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
            padding: 16px 24px;
            border-bottom: 1px solid #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 { font-size: 20px; display: flex; align-items: center; gap: 10px; }
        .status { display: flex; align-items: center; gap: 8px; font-size: 13px; }
        .status-dot {
            width: 8px; height: 8px; background: #10b981; border-radius: 50%;
            animation: pulse 2s infinite;
        }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        .api-key-bar {
            background: #1e293b;
            padding: 10px 24px;
            border-bottom: 1px solid #334155;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 13px;
        }
        .api-key-bar input {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 4px;
            padding: 6px 10px;
            color: #e2e8f0;
            width: 200px;
            font-family: monospace;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .full-width { grid-column: 1 / -1; }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
        }
        .stat-card {
            background: #1e293b;
            padding: 16px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid #334155;
        }
        .stat-value { font-size: 28px; font-weight: 700; color: #3b82f6; }
        .stat-label { font-size: 12px; color: #64748b; margin-top: 4px; }

        .card {
            background: #1e293b;
            border-radius: 8px;
            border: 1px solid #334155;
            overflow: hidden;
        }
        .card-header {
            padding: 12px 16px;
            background: #334155;
            font-weight: 600;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .card-body { padding: 16px; }

        .tool-item {
            background: #0f172a;
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 10px;
            border-left: 3px solid #3b82f6;
        }
        .tool-item:last-child { margin-bottom: 0; }
        .tool-name { font-weight: 600; color: #60a5fa; font-size: 14px; }
        .tool-desc { font-size: 12px; color: #94a3b8; margin-top: 4px; }

        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 4px; }
        .form-group select, .form-group textarea {
            width: 100%;
            padding: 8px 10px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            color: #e2e8f0;
            font-size: 13px;
        }
        .form-group textarea { min-height: 70px; font-family: monospace; resize: vertical; }

        .btn {
            padding: 8px 16px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 500;
            cursor: pointer;
            font-size: 13px;
        }
        .btn:hover { background: #2563eb; }
        .btn:disabled { background: #475569; cursor: not-allowed; }
        .btn-sm { padding: 4px 10px; font-size: 11px; }

        .result {
            margin-top: 12px;
            padding: 12px;
            background: #0f172a;
            border-radius: 6px;
            font-family: monospace;
            font-size: 12px;
            white-space: pre-wrap;
            max-height: 200px;
            overflow-y: auto;
            word-break: break-all;
        }
        .result.success { border: 1px solid #10b981; }
        .result.error { border: 1px solid #ef4444; color: #fca5a5; }

        .policy-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #334155;
            font-size: 13px;
        }
        .policy-item:last-child { border-bottom: none; }
        .policy-key { color: #94a3b8; }
        .policy-value { font-weight: 500; }
        .policy-value.on { color: #10b981; }
        .policy-value.off { color: #ef4444; }

        .activity-list { max-height: 300px; overflow-y: auto; }
        .activity-item {
            padding: 8px 0;
            border-bottom: 1px solid #334155;
            font-size: 12px;
        }
        .activity-item:last-child { border-bottom: none; }
        .activity-time { color: #64748b; font-size: 11px; }
        .activity-tool { color: #60a5fa; font-weight: 500; }
        .activity-allowed { color: #10b981; }
        .activity-denied { color: #ef4444; }
        .activity-error { color: #f59e0b; }
        .activity-reason { color: #64748b; font-size: 11px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🛡️ MCP Gateway Dashboard</h1>
        <div class="status"><div class="status-dot"></div> Server Running</div>
    </div>

    <div class="api-key-bar">
        <label>API Key:</label>
        <input type="text" id="apiKeyInput" placeholder="Enter API key">
        <span id="keyStatus" style="color: #64748b;">Loading...</span>
    </div>

    <div class="container">
        <div class="full-width">
            <div class="stats">
                <div class="stat-card">
                    <div class="stat-value" id="statTools">-</div>
                    <div class="stat-label">Registered Tools</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="statAllowed">-</div>
                    <div class="stat-label">Allowed</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="statDenied">-</div>
                    <div class="stat-label">Denied</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="statTotal">-</div>
                    <div class="stat-label">Total Requests</div>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-header">📦 Registered Tools</div>
            <div class="card-body" id="toolsList">Loading...</div>
        </div>

        <div class="card">
            <div class="card-header">🧪 Test Tool</div>
            <div class="card-body">
                <div class="form-group">
                    <label>Select Tool</label>
                    <select id="toolSelect">
                        <option value="">-- Select --</option>
                        <option value="fs.listDir">fs.listDir</option>
                        <option value="fs.readFile">fs.readFile</option>
                        <option value="web.fetch">web.fetch</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Arguments (JSON)</label>
                    <textarea id="argsInput" placeholder='{"path": "/tmp"}'></textarea>
                </div>
                <button class="btn" onclick="executeTool()">Execute</button>
                <div id="testResult"></div>
            </div>
        </div>

        <div class="card">
            <div class="card-header">⚙️ Policy Configuration</div>
            <div class="card-body" id="policyConfig">Loading...</div>
        </div>

        <div class="card">
            <div class="card-header">
                📋 Recent Activity
                <button class="btn btn-sm" onclick="clearActivity()">Clear View</button>
            </div>
            <div class="card-body">
                <div class="activity-list" id="activityList">Loading...</div>
            </div>
        </div>
    </div>

    <script>
        let apiKey = '';

        async function init() {
            try {
                const res = await fetch('/api/config');
                const cfg = await res.json();
                apiKey = cfg.apiKey || 'dev-key';
                document.getElementById('apiKeyInput').value = apiKey;
                document.getElementById('keyStatus').textContent = 'Loaded from server';
                document.getElementById('keyStatus').style.color = '#10b981';
            } catch (e) {
                apiKey = 'dev-key';
                document.getElementById('apiKeyInput').value = apiKey;
                document.getElementById('keyStatus').textContent = 'Using default';
            }

            document.getElementById('apiKeyInput').addEventListener('input', (e) => {
                apiKey = e.target.value;
            });

            loadTools();
            loadMetrics();
            loadActivity();
            setInterval(loadMetrics, 2000);
            setInterval(loadActivity, 2000);
        }

        async function apiFetch(url, options = {}) {
            const headers = { 'X-API-Key': apiKey, ...options.headers };
            return fetch(url, { ...options, headers });
        }

        async function loadTools() {
            try {
                const res = await apiFetch('/api/tools');
                const tools = await res.json();
                document.getElementById('toolsList').innerHTML = tools.map(t => `
                    <div class="tool-item">
                        <div class="tool-name">${t.name}</div>
                        <div class="tool-desc">${t.description}</div>
                    </div>
                `).join('');
            } catch (e) {
                document.getElementById('toolsList').innerHTML = '<div style="color:#ef4444">Error loading tools</div>';
            }
        }

        async function loadMetrics() {
            try {
                const res = await apiFetch('/api/metrics');
                const m = await res.json();
                document.getElementById('statTools').textContent = m.registeredTools;
                document.getElementById('statAllowed').textContent = m.allowedCount;
                document.getElementById('statDenied').textContent = m.deniedCount;
                document.getElementById('statTotal').textContent = m.totalRequests;

                const cfg = m.config;
                document.getElementById('policyConfig').innerHTML = `
                    <div class="policy-item"><span class="policy-key">Default Deny</span><span class="policy-value ${cfg.defaultDeny ? 'on' : 'off'}">${cfg.defaultDeny ? 'ENABLED' : 'DISABLED'}</span></div>
                    <div class="policy-item"><span class="policy-key">Timeout</span><span class="policy-value">${cfg.timeoutMs}ms</span></div>
                    <div class="policy-item"><span class="policy-key">Max Result Size</span><span class="policy-value">${formatBytes(cfg.maxResultBytes)}</span></div>
                    <div class="policy-item"><span class="policy-key">Filesystem</span><span class="policy-value ${cfg.fsEnabled ? 'on' : 'off'}">${cfg.fsEnabled ? 'ENABLED' : 'DISABLED'}</span></div>
                    <div class="policy-item"><span class="policy-key">HTTP Fetch</span><span class="policy-value ${cfg.httpEnabled ? 'on' : 'off'}">${cfg.httpEnabled ? 'ENABLED' : 'DISABLED'}</span></div>
                    <div class="policy-item"><span class="policy-key">PostgreSQL</span><span class="policy-value off">DISABLED</span></div>
                `;
            } catch (e) {
                console.error('Failed to load metrics', e);
            }
        }

        async function loadActivity() {
            try {
                const res = await apiFetch('/api/activity');
                const activity = await res.json();
                if (activity.length === 0) {
                    document.getElementById('activityList').innerHTML = '<div style="color:#64748b">No activity yet</div>';
                    return;
                }
                document.getElementById('activityList').innerHTML = activity.map(a => `
                    <div class="activity-item">
                        <div class="activity-time">${new Date(a.ts).toLocaleTimeString()}</div>
                        <span class="activity-tool">${a.tool}</span> -
                        <span class="activity-${a.decision.toLowerCase()}">${a.decision}</span>
                        ${a.elapsedMs ? `<span style="color:#64748b">(${a.elapsedMs}ms)</span>` : ''}
                        <div class="activity-reason">${a.reason}</div>
                    </div>
                `).join('');
            } catch (e) {
                console.error('Failed to load activity', e);
            }
        }

        function clearActivity() {
            document.getElementById('activityList').innerHTML = '<div style="color:#64748b">Cleared (server-side activity remains)</div>';
        }

        async function executeTool() {
            const tool = document.getElementById('toolSelect').value;
            const argsText = document.getElementById('argsInput').value;
            const resultDiv = document.getElementById('testResult');

            if (!tool) {
                resultDiv.innerHTML = '<div class="result error">Select a tool first</div>';
                return;
            }

            let args = {};
            if (argsText.trim()) {
                try {
                    args = JSON.parse(argsText);
                } catch (e) {
                    resultDiv.innerHTML = '<div class="result error">Invalid JSON</div>';
                    return;
                }
            }

            try {
                const res = await apiFetch('/api/call', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ tool, arguments: args })
                });
                const data = await res.json();

                if (data.ok) {
                    resultDiv.innerHTML = `<div class="result success">${JSON.stringify(data, null, 2)}</div>`;
                } else {
                    resultDiv.innerHTML = `<div class="result error">${JSON.stringify(data, null, 2)}</div>`;
                }

                loadMetrics();
                loadActivity();
            } catch (e) {
                resultDiv.innerHTML = `<div class="result error">Request failed: ${e.message}</div>`;
            }
        }

        function formatBytes(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / 1048576).toFixed(1) + ' MB';
        }

        document.getElementById('toolSelect').addEventListener('change', (e) => {
            const examples = {
                'fs.listDir': '{"path": "/tmp"}',
                'fs.readFile': '{"path": "/tmp/test.txt"}',
                'web.fetch': '{"url": "https://httpbin.org/get"}'
            };
            document.getElementById('argsInput').value = examples[e.target.value] || '';
        });

        init();
    </script>
</body>
</html>
