server:
  port: 8080

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:payments;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    username: ${DATABASE_USER:sa}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: ${DATABASE_DRIVER:org.h2.Driver}

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: ${HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true

  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:true}
      path: /h2-console

# Stripe configuration
stripe:
  secret-key: ${STRIPE_SECRET_KEY:}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}

# Application settings
app:
  base-url: ${APP_BASE_URL:http://localhost:8080}

mcp:
  policy:
    default-deny: true
    timeout-ms: 30000
    max-result-bytes: 1048576  # 1MB

  fs:
    allowlist:
      - /tmp
      - ./sandbox

  web:
    allow-domains:
      - httpbin.org
      - api.github.com
      - jsonplaceholder.typicode.com

  features:
    fs-enabled: true
    http-enabled: true

  security:
    api-key: ${MCP_SECURITY_API_KEY:dev-key}
    api-key-mode: ${MCP_SECURITY_API_KEY_MODE:strict}

logging:
  level:
    root: INFO
    com.example.mcp: DEBUG
    org.hibernate.SQL: ${SQL_LOG_LEVEL:WARN}
