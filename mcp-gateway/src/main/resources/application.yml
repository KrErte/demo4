server:
  port: 8080

mcp:
  policy:
    default-deny: true
    timeout-ms: 30000
    max-result-bytes: 1048576  # 1MB

  fs:
    allowlist:
      - /tmp
      - ./sandbox

  web:
    allow-domains:
      - httpbin.org
      - api.github.com
      - jsonplaceholder.typicode.com

  features:
    fs-enabled: true
    http-enabled: true

  security:
    api-key: dev-key

logging:
  level:
    root: INFO
    com.example.mcp: DEBUG
