server:
  port: 8080

mcp:
  policy:
    default-deny: true
    timeout-ms: 30000
    max-result-bytes: 1048576  # 1MB

  fs:
    allowlist:
      - /tmp
      - ./sandbox

  web:
    allow-domains:
      - httpbin.org
      - api.github.com
      - jsonplaceholder.typicode.com

  features:
    fs-enabled: true
    http-enabled: true

  security:
    # =========================================================================
    # API KEY CONFIGURATION
    # =========================================================================
    # Development: Use a simple key for local testing
    # Production:  Set via environment variable MCP_SECURITY_API_KEY
    #
    # To override in production, set environment variable:
    #   export MCP_SECURITY_API_KEY=your-secure-random-key-here
    #
    # Or pass as JVM argument:
    #   java -jar app.jar --mcp.security.api-key=your-secure-key
    #
    # IMPORTANT: Never commit production keys to version control!
    # =========================================================================
    api-key: ${MCP_SECURITY_API_KEY:dev-key}

    # API key validation mode:
    #   - "strict" = reject requests without valid key (production)
    #   - "warn"   = log warning but allow request (development)
    api-key-mode: ${MCP_SECURITY_API_KEY_MODE:strict}

logging:
  level:
    root: INFO
    com.example.mcp: DEBUG
